name: iOS Simulator Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-ios-simulator:
    name: Build iOS Simulator App for Appetize
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Build iOS Simulator App
        run: flutter build ios --simulator

      - name: Compress iOS App for Appetize
        run: |
          cd build/ios/iphonesimulator
          zip -r MobileSched-iOS-Simulator.zip Runner.app

      - name: Upload iOS Simulator Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MobileSched-iOS-Simulator
          path: build/ios/iphonesimulator/MobileSched-iOS-Simulator.zip