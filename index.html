<!DOCTYPE html>
<html>
<head>
  <base href="/mobileSched/">

  <meta charset="UTF-8">

  <meta
    http-equiv="X-UA-Compatible"
    content="IE=Edge"
  >

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="description"
    content="AWS HUB attendance, duty schedule, announcements and scholar updates."
  >

  <meta
    name="theme-color"
    content="#103F87"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="AWS HUB"
  >

  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="icons/apple-touch-icon.png?v=aws-hub-logo-final"
  >

  <link
    rel="icon"
    type="image/png"
    href="favicon.png"
  >

  <link
    rel="manifest"
    href="manifest.json"
  >

  <title>AWS HUB</title>

  <script
    src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js"
    defer
  ></script>

  <style>
    #aws-push-card {
      display: none;

      position: fixed;

      left: 16px;
      right: 16px;

      bottom: calc(
        16px + env(safe-area-inset-bottom)
      );

      max-width: 430px;

      margin: 0 auto;

      z-index: 999999;

      padding: 14px;

      border-radius: 20px;

      background: linear-gradient(
        135deg,
        #103F87,
        #2D8DCC
      );

      box-shadow:
        0 12px 35px
        rgba(16, 63, 135, 0.38);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    #aws-push-close {
      position: absolute;

      top: 7px;
      right: 9px;

      width: 30px;
      height: 30px;

      border: none;
      border-radius: 50%;

      background: rgba(
        255,
        255,
        255,
        0.14
      );

      color: white;

      font-size: 18px;

      cursor: pointer;
    }

    #aws-push-title {
      margin-right: 30px;

      color: white;

      font-size: 14px;

      font-weight: 900;
    }

    #aws-push-text {
      margin-top: 4px;
      margin-bottom: 11px;

      color: rgba(
        255,
        255,
        255,
        0.75
      );

      font-size: 11px;

      line-height: 1.35;
    }

    #aws-push-button {
      width: 100%;

      border: none;

      border-radius: 14px;

      padding: 12px 15px;

      background: #E5791E;

      color: white;

      font-size: 13px;

      font-weight: 900;

      cursor: pointer;

      -webkit-tap-highlight-color:
        transparent;
    }

    #aws-push-button:disabled {
      opacity: 0.65;
    }
  </style>
</head>

<body>

  <div id="aws-push-card">

    <button
      id="aws-push-close"
      type="button"
      aria-label="Close"
    >
      ×
    </button>

    <div id="aws-push-title">
      AWS HUB Notifications
    </div>

    <div id="aws-push-text">
      Enable notifications to receive AWS HUB updates.
    </div>

    <button
      id="aws-push-button"
      type="button"
    >
      Enable Notifications
    </button>

  </div>

  <script>
    window.OneSignalDeferred =
      window.OneSignalDeferred || [];

    window.OneSignalDeferred.push(
      async function (OneSignal) {

        const card =
          document.getElementById(
            "aws-push-card"
          );

        const button =
          document.getElementById(
            "aws-push-button"
          );

        const closeButton =
          document.getElementById(
            "aws-push-close"
          );

        const text =
          document.getElementById(
            "aws-push-text"
          );

        try {
          await OneSignal.init({
            appId:
              "e9e26912-3ff7-4fac-92e6-ec24f88922a4",

            serviceWorkerPath:
              "/mobileSched/push/onesignal/OneSignalSDKWorker.js",

            serviceWorkerParam: {
              scope:
                "/mobileSched/push/onesignal/"
            },

            notifyButton: {
              enable: false
            }
          });

          console.log(
            "AWS HUB OneSignal initialized"
          );

        } catch (error) {
          console.error(
            "OneSignal initialization error:",
            error
          );

          return;
        }

        const userAgent =
          navigator.userAgent || "";

        const isIOS =
          /iPhone|iPad|iPod/i.test(
            userAgent
          ) ||
          (
            navigator.platform ===
              "MacIntel" &&
            navigator.maxTouchPoints > 1
          );

        const isStandalone =
          window.matchMedia(
            "(display-mode: standalone)"
          ).matches ||
          window.navigator.standalone ===
            true;

        const supported =
          OneSignal.Notifications
            .isPushSupported();

        if (
          !isIOS ||
          !isStandalone ||
          !supported
        ) {
          card.style.display =
            "none";

          return;
        }

        function subscriptionReady() {
          const subscription =
            OneSignal.User
              .PushSubscription;

          return (
            subscription.optedIn ===
              true &&
            !!subscription.id &&
            !!subscription.token
          );
        }

        function refreshUI() {

          console.log(
            "Permission:",
            OneSignal.Notifications
              .permissionNative
          );

          console.log(
            "Subscription ID:",
            OneSignal.User
              .PushSubscription
              .id
          );

          console.log(
            "Push token:",
            OneSignal.User
              .PushSubscription
              .token
          );

          console.log(
            "Opted In:",
            OneSignal.User
              .PushSubscription
              .optedIn
          );

          /*
            IMPORTANT:
            Once the iPhone has a real
            subscription + token,
            remove the floating button.
          */
          if (subscriptionReady()) {

            card.style.display =
              "none";

            return;
          }

          const permission =
            OneSignal.Notifications
              .permissionNative;

          card.style.display =
            "block";

          if (
            permission === "denied"
          ) {
            button.disabled =
              true;

            button.textContent =
              "Notifications Blocked";

            text.textContent =
              "Open iPhone Settings → Notifications → AWS HUB and allow notifications.";

            return;
          }

          button.disabled =
            false;

          button.textContent =
            "Enable Notifications";

          text.textContent =
            "Receive announcements and AWS HUB updates on your iPhone.";
        }

        closeButton.addEventListener(
          "click",
          function () {
            card.style.display =
              "none";
          }
        );

        button.addEventListener(
          "click",
          async function () {

            button.disabled =
              true;

            button.textContent =
              "Enabling...";

            text.textContent =
              "Waiting for iPhone notification permission...";

            try {

              /*
                OneSignal Web SDK v16:
                request native permission.
              */
              await OneSignal
                .Notifications
                .requestPermission();

              if (
                OneSignal.Notifications
                  .permission !== true
              ) {

                refreshUI();

                return;
              }

              /*
                Explicitly opt the
                current Web Push
                subscription in.
              */
              await OneSignal.User
                .PushSubscription
                .optIn();

              /*
                Wait for OneSignal/Safari
                to create a Subscription ID
                and push token.
              */
              for (
                let i = 0;
                i < 12;
                i++
              ) {

                await new Promise(
                  resolve =>
                    setTimeout(
                      resolve,
                      500
                    )
                );

                if (
                  subscriptionReady()
                ) {

                  button.textContent =
                    "Notifications Enabled";

                  text.textContent =
                    "AWS HUB notifications are ready.";

                  setTimeout(
                    function () {
                      card.style.display =
                        "none";
                    },
                    900
                  );

                  console.log(
                    "AWS HUB iPhone subscription:",
                    OneSignal.User
                      .PushSubscription
                      .id
                  );

                  return;
                }
              }

              button.disabled =
                false;

              button.textContent =
                "Try Again";

              text.textContent =
                "Permission was granted, but the iPhone push subscription was not created.";

            } catch (error) {

              console.error(
                "AWS HUB push error:",
                error
              );

              button.disabled =
                false;

              button.textContent =
                "Try Again";

              text.textContent =
                "Unable to enable notifications.";
            }
          }
        );

        OneSignal.User
          .PushSubscription
          .addEventListener(
            "change",
            refreshUI
          );

        OneSignal.Notifications
          .addEventListener(
            "permissionChange",
            refreshUI
          );

        refreshUI();
      }
    );
  </script>

  <script
    src="flutter_bootstrap.js"
    async
  ></script>

</body>
</html>
