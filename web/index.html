<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="description"
    content="MobileSched attendance, duty schedule, announcements and scholar updates."
  >

  <meta name="theme-color" content="#050B14">

  <!-- iPhone / PWA -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="MobileSched"
  >

  <link
    rel="apple-touch-icon"
    href="icons/Icon-192.png"
  >

  <link
    rel="icon"
    type="image/png"
    href="favicon.png"
  >

  <title>MobileSched</title>

  <link
    rel="manifest"
    href="manifest.json"
  >

  <!-- OneSignal Web Push -->
  <script
    src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js"
    defer
  ></script>

  <script>
    window.OneSignalDeferred =
      window.OneSignalDeferred || [];

    window.OneSignalDeferred.push(
      async function (OneSignal) {
        await OneSignal.init({
          appId:
            "e9e26912-3ff7-4fac-92e6-ec24f88922a4",

          serviceWorkerPath:
            "mobileSched/push/onesignal/OneSignalSDKWorker.js",

          serviceWorkerParam: {
            scope:
              "/mobileSched/push/onesignal/"
          },

          notifyButton: {
            enable: true
          }
        });
      }
    );
  </script>
</head>

<body>
  <script
    src="flutter_bootstrap.js"
    async
  ></script>
</body>
</html>
