name: mobile_sched
description: A premium animated attendance and schedule application.
publish_to: 'none'

version: 1.3.1+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_animate: ^4.5.0
  flutter_local_notifications: ^17.1.0
  flutter_timezone: ^5.1.0
  timezone: ^0.9.4
  http: ^1.1.0
  intl: ^0.20.2
  provider: ^6.0.0
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.5
  uuid: ^4.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/mobilesched_logo.png
    - assets/images/mobilesched_branding.png